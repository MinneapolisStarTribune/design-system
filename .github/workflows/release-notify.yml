name: Release notifications

# Posts a Slack announcement when a GitHub Release is published. Kept separate
# from release.yml so a failed notification can be re-run without re-running
# the publish job.

on:
  release:
    types: [published]

jobs:
  slack:
    name: Post to Slack
    if: github.repository == 'MinneapolisStarTribune/design-system' && startsWith(github.event.release.tag_name, '@minneapolisstartribune/design-system@')
    runs-on: ubuntu-latest
    steps:
      - name: Build announcement message
        id: message
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          {
            echo "text<<MSG_EOF"
            echo "🚀 Deploying to Production! - Shared UI Library v${TAG##*@}"
            echo ""
            echo "Full changelog: ${RELEASE_URL}"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post release to Slack (Design System)
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_DESIGN_SYSTEM_RELEASE_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            { "text": ${{ toJSON(steps.message.outputs.text) }} }
