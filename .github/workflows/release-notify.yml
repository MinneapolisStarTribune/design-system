name: Release notifications

# Posts Slack announcements when a GitHub Release is published. Kept separate
# from release.yml so a failed notification can be re-run without re-running
# the publish job.

on:
  release:
    types: [published]

jobs:
  slack:
    name: Post to Slack
    if: github.repository == 'MinneapolisStarTribune/design-system' && startsWith(github.event.release.tag_name, '@minneapolisstartribune/design-system@')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Post release to Slack (Design System)
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_DESIGN_SYSTEM_RELEASE_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "🚀 Deploying to Production! - Shared UI Library v${{ steps.version.outputs.version }}\n\nFull changelog: https://github.com/MinneapolisStarTribune/design-system/releases"
            }

      - name: Post release to Slack (Shared UI Library)
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_SHARED_UI_LIBRARY_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "🚀 Deploying to Production! - Shared UI Library v${{ steps.version.outputs.version }}\n\nFull changelog: https://github.com/MinneapolisStarTribune/design-system/releases"
            }

      - name: Post release to Slack (All Releases)
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_ALL_RELEASES_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            {
              "text": "🚀 Deploying to Production! - Shared UI Library v${{ steps.version.outputs.version }}\n\nFull changelog: https://github.com/MinneapolisStarTribune/design-system/releases"
            }
