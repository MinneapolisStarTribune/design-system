name: Copilot code review setup

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-code-review.yml]
  pull_request:
    paths: [.github/workflows/copilot-code-review.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Same Node version, Corepack/Yarn 4 setup, and immutable install as
      # lint.yml and component-tests.yml. Install only — no lint, test, or
      # build steps: CI already reports those, and every review would pay for
      # them in Actions minutes. Token and icon codegen is committed
      # (src/types/mobile-themes.d.ts, src/icons/index.ts), so `tsc` resolves
      # without a build.
      - name: Configure Node environment
        uses: ./.github/actions/configure-workflow-node-environment
